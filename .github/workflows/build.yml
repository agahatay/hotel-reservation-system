name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore HotelReservationSystem.sln

      - name: Build (Release)
        run: dotnet build HotelReservationSystem.sln -c Release --no-restore

      - name: Unit tests
        run: dotnet test tests/HotelReservationSystem.Tests -c Release --no-build --logger "trx;LogFileName=unit.trx"

      - name: Start SQL Server LocalDB
        shell: pwsh
        run: |
          sqllocaldb info
          sqllocaldb start MSSQLLocalDB

      - name: SQL Server integration tests (LocalDB)
        env:
          HOTELRES_TEST_SERVER: (localdb)\MSSQLLocalDB
        run: dotnet test tests/HotelReservationSystem.IntegrationTests -c Release --no-build --logger "trx;LogFileName=integration.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: tests/**/TestResults/*.trx
